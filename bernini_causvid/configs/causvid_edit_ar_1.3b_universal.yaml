# Stage 1 AR teacher-forcing for the unified T2V/V2V/RV2V latent dataset.

model_name: Bernini-R-1.3B
model_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Bernini-R-1.3B-Wan
text_encoder_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Wan2.1-T2V-1.3B/models_t5_umt5-xxl-enc-bf16.pth
tokenizer_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Wan2.1-T2V-1.3B/google/umt5-xxl
vae_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth

causal: true
num_frame_per_block: 3
timestep_shift: 5.0
cache_text_embeds: true

# OpenVid: at most 21 latent frames (81 RGB frames).
dataset_max_lat_frames:
  openvid: 21

teacher_forcing: true
noise_augmentation_max_timestep: 100
source_noise_max_timestep: 100
source_timestep_mode: source
ref_timestep: 0  # causal student ref time embedding; 0 = clean
num_train_timestep: 1000
denoising_loss_type: flow

# Disabled for the Universal mixed run; edit_type is still kept in metadata.
region_loss: false
ref_attn_loss: false  # AR policy: clean Ref, no auxiliary attention/region losses
region_edit_weight: 2.0
region_mask_threshold: 0.10
region_mask_soft: false
region_weight_normalize: true
region_loss_by_type:
  add: true
  remove: true
  replace: true
  convert: false
  style: false
  generate: false
  animate: false
  motion_transfer: false

# Fallback/evaluation geometry. Training noise shape is taken from each
# homogeneous target batch, so variable temporal and spatial buckets are valid.
image_or_video_shape:
- 1
- 21
- 16
- 60
- 104

mixed_precision: true
gradient_checkpointing: true
batch_size: 1
gradient_accumulation_steps: 1
lr: 1.0e-5
beta1: 0.9
beta2: 0.999
weight_decay: 0.0
ema_weight: 0.0
ema_start_step: 0
seed: 0

# SHARD_GRAD_OP avoids FSDP1 hook issues caused by the generator's repeated
# forward_edit calls within one optimization step.
sharding_strategy: grad_op

data_path: /opt/dlami/nvme/chenxinyu/data/Universal-Edit-Metadata/mixed_train/index_instruction.json

# Per-dataset sampling ratios. Values are normalized automatically and allocate
# batches exactly by ratio while preserving task/shape-homogeneous batches.
dataset_sampling_weights:
  openvid: 0.40
  reco: 0.40
  tripvvt: 0.20

# Fixed qualitative validation coverage. Every configured group must match, and
# train_edit_ar.py refuses to start if any task_type in the training index is absent.
eval_samples:
- name: t2v_openvid
  dataset: openvid
  task_type: t2v
- name: v2v_reco_add
  dataset: reco
  task_type: v2v
  edit_type: add
- name: v2v_reco_remove
  dataset: reco
  task_type: v2v
  edit_type: remove
- name: v2v_reco_replace
  dataset: reco
  task_type: v2v
  edit_type: replace
- name: v2v_reco_style
  dataset: reco
  task_type: v2v
  edit_type: style
- name: rv2v_tripvvt
  dataset: tripvvt
  task_type: rv2v
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
