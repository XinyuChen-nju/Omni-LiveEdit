# Stage 3：1.3B generator/fake_score + Bernini-R 14B dual-expert real_score。

# ---- 模型 / 骨架 -----------------------------------------------------------
model_name: Bernini-R-1.3B
model_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Bernini-R-1.3B-Wan
text_encoder_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Wan2.1-T2V-1.3B/models_t5_umt5-xxl-enc-bf16.pth
tokenizer_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Wan2.1-T2V-1.3B/google/umt5-xxl
vae_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Wan2.1-T2V-1.3B/Wan2.1_VAE.pth
causal: true
num_frame_per_block: 3
timestep_shift: 5.0

# ---- 14B real_score only ----------------------------------------------------
teacher_model_name: Bernini-R-14B
teacher_model_path: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Bernini-R-14B-high
teacher_model_path_low: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/wan_models/Bernini-R-14B-low
teacher_switch_boundary: 875
teacher_omega_scale: 0.75
teacher_load_in_mixed_precision: true
teacher_sharding_strategy: hybrid_full
teacher_cpu_offload: false

# 数据 index 已包含预计算 prompt embedding。跳过 umT5 可显著降低每卡显存。
cache_text_embeds: true

# ---- Stage 2 初始化 --------------------------------------------------------
generator_ckpt: /opt/dlami/nvme/chenxinyu/project/Causal-Forcing/runs/bernini_edit_cd_chunk3_6w_src_ar12000_2node/20260805_h2h3_fresh_v1/checkpoints/checkpoint_model_002000/model.pt
fake_score_init: teacher
allow_raw_bernini_init: false

# ---- source 条件语义 -------------------------------------------------------
source_timestep_mode: source
ref_timestep: 0                     # causal student ref time embedding; 0 = clean
source_noise: 0
context_noise: 0
score_source_timestep_mode: target
score_causal_source: false

# ---- Bernini real-score guidance ------------------------------------------
guidance_mode: v2v_apg
guidance_mode_by_task_type:
  t2v: t2v
  v2v: v2v_apg
  tv2v: v2v_apg
  rv2v: rv2v_apg
guidance_scale: 3.0
omega_v: 1.25
omega_i: 4.5
omega_ti: 4.0
apg_eta: 0.5
apg_norm_threshold: 50.0

# ---- DMD / Self-Forcing ---------------------------------------------------
distribution_loss: dmd
trainer: score_distillation
denoising_loss_type: flow
denoising_step_list:
- 1000
- 500
warp_denoising_step: true
ts_schedule: false
min_score_timestep: 0
num_train_timestep: 1000
generator_start_step: 0
dfake_gen_update_ratio: 5

image_or_video_shape:
- 1
- 21
- 16
- 60
- 104

# ---- 优化 ------------------------------------------------------------------
mixed_precision: true
gradient_checkpointing: true
batch_size: 1
gradient_accumulation_steps: 1
lr: 2.0e-6
lr_critic: 4.0e-7
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
weight_decay: 0.0
ema_weight: 0.99
ema_start_step: 200
seed: 0

# ---- 分布式 / FSDP --------------------------------------------------------
sharding_strategy: hybrid_full

# ---- 数据 ------------------------------------------------------------------
data_path: /opt/dlami/nvme/chenxinyu/data/Reco/distill_for_bernini_merged-60000/edit_lat_full/index.json
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
