[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-live-edit"
version = "0.1.0"
description = "AR, consistency-distillation, and DMD training for causal video editing"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "accelerate>=1.1,<2",
    "av>=13,<15",
    "decord>=0.6,<1",
    "diffusers>=0.31,<0.32",
    "easydict>=1.13,<2",
    "einops>=0.8,<1",
    "ftfy>=6.3,<7",
    "huggingface-hub>=0.26,<1",
    "imageio[ffmpeg]>=2.36,<3",
    "numpy>=1.24,<2",
    "omegaconf>=2.3,<3",
    "packaging>=24,<26",
    "Pillow>=10,<12",
    "regex>=2024.11",
    "requests>=2.32,<3",
    "safetensors>=0.4,<1",
    "scipy>=1.10,<2",
    "sentencepiece>=0.2,<1",
    "tensorboard>=2.18,<3",
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "tqdm>=4.67,<5",
    "transformers>=4.46,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]
distributed = [
    "xfuser>=0.4,<0.5",
]
flash-attention = [
    "flash-attn>=2.7,<3",
]
prompt-extension = [
    "dashscope>=1.20,<2",
]
visualization = [
    "matplotlib>=3.9,<4",
]

[project.scripts]
omniliveedit-infer = "bernini_causvid.inference_edit:main"

[project.urls]
Repository = "https://github.com/XinyuChen-nju/Omni-LiveEdit"
Issues = "https://github.com/XinyuChen-nju/Omni-LiveEdit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bernini_causvid*", "configs", "wan*", "utils*"]
exclude = ["bernini_causvid.tests*"]
namespaces = true

[tool.setuptools.package-data]
configs = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["bernini_causvid/tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
