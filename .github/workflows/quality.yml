name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install static-check dependencies
        run: python -m pip install "omegaconf>=2.3,<3" "ruff>=0.11,<1"
      - name: Lint first-party code
        run: ruff check bernini_causvid utils tools
      - name: Compile Python sources
        run: python -m compileall -q bernini_causvid configs utils wan tools
      - name: Validate release layout
        run: python tools/validate_release.py
      - name: Validate shell launchers
        run: bash -n scripts/*.sh
